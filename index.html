<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4A2F12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="蛋小固">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<title>蛋小固 · 蛋鸡场管家</title>
<style>
  :root{
    --bg:#F6F1E7; --card:#FFFFFF; --ink:#3D2B12; --sub:#8A7357;
    --line:#EADFCB; --brand:#D97A1F; --brand2:#F0A63C; --brand-soft:#FBF0DC;
    --green:#2E8B57; --red:#CC4B4B; --red-soft:#FDEEEE; --th:#F8F0DE;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55}
  /* ---- 顶栏: 咖啡棕渐变 + 琥珀光 ---- */
  header{background:linear-gradient(135deg,#4A2F12 0%,#7A4A16 100%);color:#fff;padding:16px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(74,47,18,.25)}
  header .logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#F5A623,#E8862E);display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
  header h1{font-size:20px;font-weight:700;letter-spacing:.5px}
  header .sub{font-size:12px;opacity:.85;margin-top:1px}
  /* ---- 导航: 横滑药丸 ---- */
  nav{display:flex;gap:7px;padding:11px 14px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:9;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;color:var(--ink);padding:10px 17px;border-radius:99px;font-size:15px;cursor:pointer;transition:all .15s}
  nav button.active{background:linear-gradient(135deg,var(--brand2),var(--brand));border-color:transparent;color:#fff;font-weight:600;box-shadow:0 2px 6px rgba(217,122,31,.35)}
  main{padding:14px;max-width:960px;margin:0 auto;padding-bottom:70px}
  /* ---- 更多页卡片 ---- */
  .morecard{display:flex;align-items:center;gap:12px;padding:14px 12px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s}
  .morecard:last-child{border-bottom:none}
  .morecard:active{background:var(--brand-soft)}
  .mc-ico{width:40px;height:40px;border-radius:12px;background:var(--brand-soft);display:flex;align-items:center;justify-content:center;font-size:22px;flex:0 0 auto}
  .mc-mid{flex:1;min-width:0}
  .mc-t{font-size:16px;font-weight:600}
  .mc-d{font-size:12.5px;color:var(--sub);margin-top:1px}
  .mc-arrow{font-size:22px;color:var(--sub);font-weight:300}
  /* ---- 数据卡 ---- */
  .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 1px 4px rgba(90,60,20,.05)}
  .card .num{font-size:27px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.3px}
  .card .lab{font-size:13px;color:var(--sub);margin-top:2px}
  .card.good .num{color:var(--green)}
  .card.warn{border-color:#F0C9C9;background:var(--red-soft)}
  .card.warn .num{color:var(--red)}
  /* ---- 面板 ---- */
  section.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:14px;box-shadow:0 1px 4px rgba(90,60,20,.05)}
  .panel h2{font-size:16px;font-weight:700;margin-bottom:11px;display:flex;align-items:center;gap:6px;letter-spacing:.3px}
  /* ---- 表单 ---- */
  form{display:flex;flex-wrap:wrap;gap:9px;align-items:flex-end}
  .field{display:flex;flex-direction:column;gap:3px;flex:0 1 auto}
  .field label{font-size:12px;color:var(--sub);font-weight:600}
  input,select{border:1.5px solid var(--line);border-radius:10px;padding:8px 11px;font-size:15px;background:#FFFDF8;color:var(--ink);min-width:105px;transition:border .15s}
  input:focus,select:focus{outline:none;border-color:var(--brand2);box-shadow:0 0 0 3px rgba(240,166,60,.15)}
  input[type=date]{min-width:132px}
  button.go{background:linear-gradient(135deg,var(--brand2),var(--brand));border:none;color:#fff;font-size:15px;font-weight:600;padding:9px 20px;border-radius:10px;cursor:pointer;box-shadow:0 2px 6px rgba(217,122,31,.3);transition:transform .1s}
  button.go:active{transform:scale(.96)}
  button.mini{background:#fff;border:1.5px solid var(--line);color:var(--sub);font-size:13px;padding:5px 11px;border-radius:9px;cursor:pointer}
  /* ---- 表格 ---- */
  table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
  th{padding:6px 6px}td{padding:6px 5px}
  .scrollx{overflow-x:auto}
  .scrollx table{min-width:640px}
  th{background:var(--th);color:var(--sub);font-weight:600;padding:8px 9px;text-align:left;white-space:nowrap;border-radius:0}
  td{padding:8px 9px;border-top:1px solid #F3EADA}
  tbody tr:nth-child(even) td{background:#FCF9F2}
  tr:hover td{background:var(--brand-soft)}
  .money{font-variant-numeric:tabular-nums;font-weight:600}
  .neg{color:var(--red)}.pos{color:var(--green)}
  .tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:500}
  .tag.w{background:var(--red-soft);color:var(--red)}
  .tag.s{background:#FFF4DC;color:#B87A10}
  .tag.ok{background:#EAF6EE;color:var(--green)}
  .tag.up{background:#EAF6EE;color:var(--green)}
  .tag.dn{background:var(--red-soft);color:var(--red)}
  /* ---- 行情图表 ---- */
  .bigprice{font-size:30px;font-weight:700;color:var(--ink);margin:6px 0 2px}
  .bigprice small{font-size:14px;color:var(--sub);font-weight:400}
  .chart{display:flex;align-items:flex-end;gap:6px;height:150px;padding:8px 4px 0;overflow-x:auto}
  .barwrap{flex:0 0 44px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:40px}
  .barval{font-size:11px;font-weight:600;color:var(--ink);margin-bottom:3px}
  .bar{width:26px;border-radius:6px 6px 2px 2px;min-height:18px}
  .barlab{font-size:10px;color:var(--sub);margin-top:4px;white-space:nowrap}
  .barn{font-size:9px;color:#C5B79F}
  button.mini.active{background:var(--brand);border-color:var(--brand);color:#fff}
  .empty{text-align:center;color:#B49B72;padding:26px 0;font-size:14px}
  .hint{font-size:12px;color:#A78B5F;margin-top:9px;line-height:1.7}
  .del{color:#C96A6A;cursor:pointer;font-size:13px;background:none;border:none;text-decoration:underline}
  .row-actions{white-space:nowrap}
  @media(max-width:640px){
    nav button{padding:7px 12px;font-size:13px}
    .card .num{font-size:21px}
    table{font-size:12.5px}th,td{padding:6px 5px}
    input,select{min-width:90px;font-size:15px}
    .cards{grid-template-columns:1fr 1fr}
  }
</style>
</head>

function smartField(name,opts,id,oninput){

// ================= 登录锁 (SHA-256 本地散列, 无服务器; 支持密保问题找回) =================
async function sha256(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s.trim().toLowerCase()));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function loggedIn(){return sessionStorage.getItem("gx_login")==="1"}
function hasAuth(){return S.auth&&S.auth.hash}
function hasSecQ(){return hasAuth()&&S.auth.q&&S.auth.a}
async function tryLogin(e){e.preventDefault();const fd=new FormData(e.target);const pw=fd.get("pw");const h=await sha256(pw);
  if(hasAuth()){if(h===S.auth.hash){sessionStorage.setItem("gx_login","1");bootApp()}else{document.getElementById("login_err").style.display="";}}
  else{if(!pw||pw.length<4){document.getElementById("login_err").textContent="密码至少4位";document.getElementById("login_err").style.display="";return}
    if(pw!==fd.get("pw2")){document.getElementById("login_err").textContent="两次输入不一致";document.getElementById("login_err").style.display="";return}
    const q=fd.get("secq"),a=fd.get("seca");
    if(!q||!a||!a.trim()){document.getElementById("login_err").textContent="请设置密保问题和答案(用于忘密码找回)";document.getElementById("login_err").style.display="";return}
    S.auth={hash:h,set:today(),q,a:await sha256(a)};save();sessionStorage.setItem("gx_login","1");bootApp()}}
async function recoverPw(e){e.preventDefault();const fd=new FormData(e.target);const a=fd.get("ra");
  const h=await sha256(a);
  if(!hasSecQ()||h!==S.auth.a){document.getElementById("rec_err").textContent="答案不对";document.getElementById("rec_err").style.display="";return}
  const p1=fd.get("np1"),p2=fd.get("np2");
  if(!p1||p1.length<4){document.getElementById("rec_err").textContent="新密码至少4位";document.getElementById("rec_err").style.display="";return}
  if(p1!==p2){document.getElementById("rec_err").textContent="两次输入的新密码不一致";document.getElementById("rec_err").style.display="";return}
  S.auth.hash=await sha256(p1);save();sessionStorage.setItem("gx_login","1");bootApp()}

// ================= 计算层 =================
function stockCount(){return S.flock.reduce((a,r)=>a+r.qty,0)}
function stockOn(day){return S.flock.reduce((a,r)=>a+(r.date<=day?+r.qty:0),0)}
function bagKg(){const v=+S.bagkg;return v>0?v:50} // 默认包重(kg), 新物料/未记过的用它

// ================= 单位体系 v2: 自定义单位(桶/袋...) + 单价随单位 =================
function unitDefs(){ // 全量单位表: [名, 折斤系数]  斤=1 公斤=2 吨=2000 包/桶/袋=按物料记忆或默认
  const base=[["斤",1],["公斤",2],["吨",2000],["包",0]];
  const cus=(S.units||[]).map(u=>[u.name,0]); // 系数0=按物料记"每单位kg"
  return base.concat(cus)}
function unitIsCustom(n){return ["斤","公斤","吨","包"].indexOf(n)<0}
function unitJinOf(item,unit){ // 单位→斤 (用于库存折算); 自定义单位靠 S.unitKg[item][unit]=每单位kg
  if(unit==="斤")return 1; if(unit==="公斤")return 2; if(unit==="吨")return 2000;
  if(unit==="包")return bagKgOf(item)*2;
  const kg=(S.unitKg&&S.unitKg[item]&&S.unitKg[item][unit])||0;
  return kg>0?kg*2:0}
function rememberUnitKg(item,unit,kg){S.unitKg=S.unitKg||{};S.unitKg[item]=S.unitKg[item]||{};S.unitKg[item][unit]=+kg}
function mainUnitOf(item){ // 物料的主单位: 最近一次入库用的单位; 没有则"斤"
  const r=[...S.feedLog].reverse().find(x=>x.item===item&&x.dir&&x.dir.startsWith("入"));
  return (r&&r.unit)||"斤"}
function bagKgOf(item){const m=(S.bagKgMap||{})[item];return (+m>0)?+m:bagKg()} // 物料自己的包重优先
function rememberBagKg(item,kg){if(!item||!(kg>0))return;S.bagKgMap=S.bagKgMap||{};S.bagKgMap[item]=kg}
function unitOptsHTML(){ // 基础单位 + 包 + 记忆单位(unitKg里出现过的) + 新建
  const base=unitDefs();
  const mem=new Set();const U=S.unitKg||{};Object.keys(U).forEach(it=>Object.keys(U[it]).forEach(u=>{if(u&&u!=="undefined")mem.add(u)}));
  (S.units||[]).forEach(u=>mem.add(u.name));
  const all=base.map(u=>u[0]).concat([].concat([...mem]).filter(u=>!base.some(b=>b[0]===u)));
  return all.map(u=>`<option value="${u}">${u}</option>`).join('')+'<option value="__newunit__">➕ 新建单位…</option>'}
function feedUnitUI(sel){
  const f=sel.closest("form");if(!f)return;
  const bag=f.querySelector("#bagkg_field");const uk=f.querySelector("#unitkg_field");
  if(sel.value==="__newunit__"){
    const nm=prompt("新单位名称(如: 桶/袋/车):");if(!nm){sel.value="斤";feedUnitUI(sel);return}
    nm.trim();
    if(unitDefs().some(u=>u[0]===nm.trim())){alert("这个单位已经有了");sel.value="斤";feedUnitUI(sel);return}
    S.units=S.units||[];S.units.push({name:nm.trim()});save();
    const opt=document.createElement("option");opt.value=nm.trim();opt.textContent=nm.trim();
    sel.insertBefore(opt,sel.querySelector('option[value="__newunit__"]'));sel.value=nm.trim();
  }
  const v=sel.value;
  if(bag)bag.style.display=v==="包"?"":"none";
  if(uk)uk.style.display=(v==="包"||unitIsCustom(v))?"":"none";
  const lb=f.querySelector("#price_label");if(lb)lb.textContent="单价(元/"+v+")";
  const ukIn=f.querySelector('[name="unitkg"]');if(ukIn)ukIn.placeholder=v==="包"?"每包重量(kg)":"每"+v+"重量(kg)";
  const selItem=f.querySelector('select[name="item"]');if(selItem)feedItemTipFromForm(selItem)}
function feedItemTipFromForm(sel){const f=sel.closest("form");const c=f.querySelector('[name="item_c"]');const v=sel.value==="__custom__"?(c&&c.value.trim()||""):sel.value;const m=(S.bagKgMap||{})[v];const el=f.querySelector("#feed_bagkg");if(m>0&&el)el.value=m} // 选物料自动带出记忆包重
function monthSum(list,dateKey,amtFn,m){return list.filter(r=>monthOf(r[dateKey])===m).reduce((a,r)=>a+(amtFn?amtFn(r):r.amount),0)}
function salesAmt(r){return r2(r.qty*r.price)}
function lowFeed(){const R=recipeGet();if(R.total>0&&R.rows.length){const ia=invAlerts().filter(a=>a.lvl==="r").map(a=>a.txt.split(" ")[0]);if(ia.length)return ia}return Object.entries(S.feedStock).filter(([k,v])=>v<=100).map(([k])=>k)}
// ================= 混合料配方 + 每日自动消耗 =================
// recipe = {total:每日总耗(斤), rows:[{item,pct}], per:每只日耗(两/只, 仅展示), enabled:true}
function recipeGet(){if(!S.recipe)S.recipe={total:0,rows:[],enabled:true};if(!S.recipe.rows)S.recipe.rows=[];return S.recipe}
// 配方编辑行(编辑期间暂存, 与 S.recipe 分离, 保存才生效)
let RECIPE_DRAFT=null;
function draftRows(){if(!RECIPE_DRAFT)RECIPE_DRAFT=(S.recipe&&S.recipe.rows.length?[...S.recipe.rows.map(r=>({...r}))]:[{item:"",pct:""},{item:"",pct:""},{item:"",pct:""}]).slice(0,12);return RECIPE_DRAFT}
function harvestDraft(){const f=document.querySelector('form[onsubmit="saveRecipe(event)"]');if(!f||!RECIPE_DRAFT)return;const v={};new FormData(f).forEach((x,k)=>v[k]=x);RECIPE_DRAFT.forEach((r,i)=>{r.item=v["ri"+i]||"";r.b=v["rb"+i]||"";const jv=parseFloat(v["rk"+i]);r.k=(jv>0)?r2(jv/2):(v["rk"+i]||"");r.pct=v["rp"+i]||""})}
function recipeAddRow(){const d=draftRows();harvestDraft();if(d.length>=12){alert("最多12个品种, 够配预混料了 :)");return}d.push({item:"",pct:""});render()}
function recipeDelRow(i){const d=draftRows();harvestDraft();d.splice(i,1);render()}
function rowUnitKg(nm,k){if(k>0)return k; // 手填kg优先
  if(S.unitKg&&S.unitKg[nm]){const ks=Object.values(S.unitKg[nm]);if(ks.length)return Math.max.apply(null,ks)} // 该物料记过的最大单位重
  return bagKgOf(nm)}
function recipeLive(){ // 行编辑实时汇总: 一批总量=Σ(数量×斤/单位); 每日=批量÷天数
  const f=document.querySelector('form[onsubmit="saveRecipe(event)"]');if(!f)return;
  const days=Math.max(1,+((f.querySelector('[name="days"]')||{}).value)||1);
  let wsum=0;const ws=[];
  for(let i=0;i<12;i++){const b=+(f.querySelector('[name="rb'+i+'"]')||{}).value||0;const jin=+(f.querySelector('[name="rk'+i+'"]')||{}).value||0;
    const w=b>0&&jin>0?b*jin:0;ws.push(w);wsum+=w}
  const per=wsum>0?r2(wsum/days):0;
  const tv=f.querySelector("#recipe_total_val"),ts=f.querySelector("#recipe_total_show");
  if(wsum>0){if(tv)tv.value=r2(per);if(ts)ts.value=(days>1?`一批${fmt(r2(wsum))}斤 ÷${days}天 = `:"")+fmt(per)+" 斤/天"}else{if(ts)ts.value="填好下表自动算"}
  f.querySelectorAll('[name^="rp"]').forEach((el,i)=>{if(ws[i]!==undefined&&wsum>0)el.value=Math.round(ws[i]/wsum*1000)/10})}
function recipeRowJin(nm,jinInput){ // 斤/单位输入→kg存储
  return jinInput>0?r2(jinInput/2):(S.unitKg&&S.unitKg[nm]&&Math.max.apply(null,Object.values(S.unitKg[nm])))||bagKgOf(nm)}
function pctFill(){recipeLive()}
function saveRecipe(e){e.preventDefault();const d=fd(e.target);
  // 行→ {item, b(数量), k(kg存储)}: 斤/单位输入÷2存kg; 留空则用该物料入库记过的单位重
  let wsum=0;const tmp=[];
  for(let i=0;i<12;i++){const it=(d["ri"+i]||"").trim(),b=+d["rb"+i]||0,jinIn=+d["rk"+i]||0;
    if(it&&b>0){const k=recipeRowJin(it,jinIn);const w=r2(b*k*2);tmp.push({item:it,b,k,w});wsum+=r2(w)}}
  if(!(wsum>0)){alert("至少填一行: 品种+数量(斤/单位留空则按入库时记的重量)");return}
  const days=Math.max(1,+d.days||1);
  const t=r2(wsum/days); // 每日总耗 = 一批总量 ÷ 天数
  const rows=tmp.map(x=>({item:x.item,pct:r2(x.w/wsum*100),b:x.b,k:x.k}));
  S.recipe={total:t,batch:r2(wsum),days,rows,per:+d.per||r2(t/stockCount()*10),enabled:true,since:(S.recipe&&S.recipe.since)||today()};
  RECIPE_DRAFT=null;touchSave();
  syncMsg(`✅ 配方已存: ${days>1?`${days}天一批共${fmt(r2(wsum))}斤, `:""}每日 ${fmt(t)} 斤 = `+rows.map(r=>`${r.item}${fmt(r.pct)}%`).join(" + "));render()}
function recipeToggle(){S.recipe.enabled=!S.recipe.enabled;touchSave();render()}
function runConsume(){ // 手动"记今日消耗"(补记/重记今日; 自动消耗在启动时做)
  const R=recipeGet();if(!R.enabled||!(R.total>0)||!R.rows.length){alert("请先设置配方并启用");return}
  if(!(stockOn(today())>0)){alert("今日没有存栏(鸡未上或已清栏), 不记饲料消耗");return}
  if(!consumeDay(today(),true)){alert("账上物料不够今日消耗(有品种库存不足), 未记账。请先入库缺的料 — 这是防错账的保护。");return}
  syncMsg("✅ 已记今日消耗 "+fmt(R.total)+" 斤");render()}
function bookStart(){ // 记账起点: 自动补记只认 max(配方起始日, 首笔真实入库日) — 账没开始前的日子一律不补
  const first=S.feedLog.filter(r=>r.dir&&r.dir.startsWith("入")&&!r.auto).map(r=>r.date).sort()[0];
  const since=S.recipe&&S.recipe.since;
  if(first&&since)return first>since?first:since;
  return since||first||""}
function consumeDay(day,force){ // 把 day 的消耗折成一组出库流水(当日已有则跳过, force 则先撤旧)
  const R=recipeGet();if(!(R.total>0)||!R.rows.length)return false;
  const bs=bookStart();if(bs&&day<bs)return false; // 记账起点之前不补记
  const st=stockOn(day); // 当天存栏(此日前所有栏群变动合计)
  const old=S.feedLog.filter(r=>r.auto&&r.date===day);
  if(old.length){old.forEach(r=>{S.feedStock[r.item]=r2((S.feedStock[r.item]||0)+r.jin)});
    S.feedLog=S.feedLog.filter(r=>!(r.auto&&r.date===day))}
  if(!(st>0))return false; // 鸡未上/已清栏: 不记消耗, 不标记(日后补录上鸡会自动再判)
  const tag=`自动消耗 ${day.slice(5).replace("-","/")}`;
  // 先试算: 任何物料扣后透支(账上没那么多) → 整日不记, 防止"无中生有的历史扣减"吃掉新入库
  const trial={};Object.assign(trial,S.feedStock);
  const dys0=Math.max(1,+R.days||1);
  for(const row of R.rows){const jin=(row.b&&row.k)?r2(row.b*row.k*2/dys0):r2(R.total*row.pct/100);if(jin<=0)continue;
    if(r2((trial[row.item]||0)-jin)<0)return false; // 透支: 不记, 等真入库后自然恢复
    trial[row.item]=r2((trial[row.item]||0)-jin)}
  const dys=Math.max(1,+R.days||1);
  R.rows.forEach(row=>{const jin=(row.b&&row.k)?r2(row.b*row.k*2/dys):r2(R.total*row.pct/100);if(jin<=0)return;
    S.feedStock[row.item]=r2((S.feedStock[row.item]||0)-jin);
    S.feedLog.push({id:uid(),date:day,item:row.item,dir:"出库(饲喂)",qty:jin,unit:"斤",jin,auto:true,note:tag})});
  S.consume[day]=true;touchSave();return true}
function healBad(){ // 撤销"无鸡日/记账起点前"的自动消耗并回收库存(开机与每次云合并后都要跑, 防云端还魂)
  const bs=bookStart();
  // 假扣减判定: 按日期序重放库存, 自动扣导致该物料累计<0 的整日扣减都算"无中生有", 撤销
  const negDays=new Set();const bal={};
  S.feedLog.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0).forEach(r=>{const j=r2(+r.jin||0);if(!j)return;
    const it=r.item;bal[it]=r2((bal[it]||0)+((r.dir||"").startsWith("出")?-j:j));
    if(r.auto&&(r.dir||"").startsWith("出")&&bal[it]<0)negDays.add(r.date)});
  const bad=S.feedLog.filter(r=>r.auto&&(stockOn(r.date)<=0||(bs&&r.date<bs)||negDays.has(r.date)));
  if(!bad.length)return 0;
  bad.forEach(r=>{S.feedStock[r.item]=r2((S.feedStock[r.item]||0)+r.jin)});
  const bd=new Set(bad.map(r=>r.date));S.feedLog=S.feedLog.filter(r=>!(r.auto&&bd.has(r.date)));
  bd.forEach(ds=>{delete S.consume[ds]});return bad.length}
function backfillConsume(){ // 启动时补齐上次用到今天的每日消耗(每次打开最多补7天, 再久提示手动核)
  if(healBad()>0){save();render()}
  const R=recipeGet();if(!S.recipe||!R.enabled||!(R.total>0)||!R.rows.length)return;
  const days=[];const d=new Date();
  for(let i=0;i<7;i++){const dd=new Date(d);const ds2=dd.getFullYear()+"-"+String(dd.getMonth()+1).padStart(2,"0")+"-"+String(dd.getDate()).padStart(2,"0");if(!S.consume[ds2])days.push(ds2);d.setDate(d.getDate()-1)}
  days.reverse().forEach(day=>consumeDay(day,false))}
function feedInv(){ // 库存盘查: 每品种库存/日耗/可撑天数
  const R=recipeGet();const daily={};R.rows.forEach(r=>daily[r.item]=R.total*r.pct/100);
  const items=new Set([...Object.keys(S.feedStock),...Object.keys(daily)]);
  return [...items].map(k=>{const st=S.feedStock[k]||0,d=daily[k]||0;
    const days=d>0?Math.floor(st/d*10)/10:null;
    return {item:k,st,daily:d,days}})}
function invAlerts(){return feedInv().filter(x=>x.daily>0).map(x=>{if(x.days===null)return null;
  if(x.days<0)return {lvl:"r",txt:`${x.item} 已透支 ${fmt(Math.abs(x.st))} 斤(库存为负, 该入库了)`};
  if(x.days<=3)return {lvl:"r",txt:`${x.item} 仅够 ${x.days<1?"不足1":x.days} 天(${fmt(x.st)}斤)`};
  if(x.days<=7)return {lvl:"w",txt:`${x.item} 约 ${x.days} 天(${fmt(x.st)}斤)`};return null}).filter(Boolean)}
function vaxAlerts(){const out=[];const t=today();
  // 来自免疫计划的待办: 未勾选且日期已进入7天窗口或已过期
  if(S.plan&&S.plan.start){for(const it of planAll()){if(S.plan.done&&S.plan.done.includes(it.cid||it.d))continue;const due=addDays(S.plan.start,it.d);if(due<=addDays(t,7))out.push({name:it.name,due,lvl:due<t?"w":"s",txt:`${due<t?"已过期":"计划"} ${due} · ${it.name}(${it.d}日龄)`})}}
  // 来自免疫档案的下次免疫
  for(const v of S.vaccines){if(!v.next)continue;if(v.next<t)out.push({...v,due:v.next,lvl:"w",txt:`已到期 ${v.next} · ${v.name}`});else{const dd=Math.round((new Date(v.next)-new Date(t))/864e5);if(dd<=7)out.push({...v,due:v.next,lvl:"s",txt:`${dd===0?"今天":dd+"天后"} ${v.next} · ${v.name}`})}}
  return out.sort((a,b)=>a.due<b.due?-1:1)}
const addDays=(iso,n)=>{const d=new Date(iso+"T00:00:00");d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
function planAge(){if(!S.plan||!S.plan.start)return null;return Math.round((new Date(today()+"T00:00:00")-new Date(S.plan.start+"T00:00:00"))/864e5)}
function planDoneCount(){return S.plan&&S.plan.done?S.plan.done.length:0}

function creditList(){ // 全部未平账: [{type,rec,amt,label}] type=sales(应收)|finance(应付)

  S.finance.forEach(r=>{if(r.pay==="credit"&&r.kind==="支")out.push({type:"finance",rec:r,amt:r.amount,label:r.item||r.cat})});

function settleCredit(type,id){ // 平账: 标记已收/已付, 记平账时间

function perUnitJin(item,unit){ // 该物料某单位的实际斤重: 流水回放 > 单位记忆 > 包重记忆 > 默认
  let sj=0,sq=0;
  S.feedLog.forEach(r=>{if(r.item===item&&r.unit===unit&&r.dir&&r.dir.startsWith("入")&&+r.qty>0&&+r.jin>0){sj+=+r.jin;sq+=+r.qty}});
  if(sq>0&&sj>0)return r2(sj/sq);
  if(unit==="包")return bagKgOf(item)*2;
  if(unitIsCustom(unit)){const kg=S.unitKg&&S.unitKg[item]&&S.unitKg[item][unit];return kg>0?kg*2:0}
  if(unit==="公斤")return 2;if(unit==="吨")return 2000;
  return 1}
function unitJinOf(item,unit){ // 优先流水推算
  const p=perUnitJin(item,unit);if(p>0&&p!==1)return p;
  if(unit==="斤")return 1;if(unit==="公斤")return 2;if(unit==="吨")return 2000;
  if(unit==="包")return bagKgOf(item)*2;
  const kg=S.unitKg&&S.unitKg[item]&&S.unitKg[item][unit];
  return kg>0?kg*2:0}
function stockRowsHTML(){ // 库存一览: 结余按入库主单位显示, 附日耗/可撑 (v15 合并版)
  const R=recipeGet();const daily={};R.rows.forEach(r=>daily[r.item]=R.total*r.pct/100);
  const ks=Object.keys(S.feedStock).filter(k=>Math.abs(S.feedStock[k])>0.001);
  ks.sort((a,b)=>Math.abs(S.feedStock[b])-Math.abs(S.feedStock[a]));
  if(!ks.length)return `<div class="empty">暂无库存 — 入库后自动生成</div>`;
  return `<table><tr><th>物料</th><th>结余</th><th>状态</th></tr>`+ks.map(k=>{
    const st=S.feedStock[k],mu=mainUnitOf(k),uj=unitJinOf(k,mu);
    const muTxt=uj>0?fmt(Math.round(st/uj*10)/10)+"<small>"+mu+"</small>":fmt(Math.round(st/2*10)/10)+"<small>kg</small>";
    const pu=perUnitJin(k,mu);
    const sub=pu>0&&mu!=="斤"?(mu==="包"?`${r2(pu/2)}kg/包`:`${r2(pu/2)}kg/${mu}`):"";
    const dl=daily[k]||0;
    const days=dl>0?Math.floor(st/dl*10)/10:null;
    const lamp=st<0?`<span class="tag r">透支</span>`:(days!==null&&days<=3?`<span class="tag r">仅够${days<1?"不足1":days}天</span>`:(days!==null&&days<=7?`<span class="tag w">约${days}天</span>`:(days!==null?`<span class="tag s">够${days}天</span>`:"")));
    const detail=fmt(st)+"斤"+(sub?` · ${sub}`:"")+(dl>0?` · 日耗${fmt(r2(dl))}斤`:"");
    return `<tr><td>${k}<div style="font-size:11px;color:var(--sub)">${detail}</div></td><td class="money ${st<0?'neg':''}" style="font-size:17px">${muTxt}</td><td>${lamp}</td></tr>`}).join("")+`</table>`}
function foldState(key){window.FOLD_TAB=window.FOLD_TAB||{};if(window.FOLD_TAB[key]===undefined)window.FOLD_TAB[key]=0;return window.FOLD_TAB[key]}
function foldToggle(key){window.FOLD_TAB=window.FOLD_TAB||{};window.FOLD_TAB[key]=(window.FOLD_TAB[key]?0:1);render()}
function foldRows(list,dateKey,rowFn,sumFn,hintText){ // 通用按日折叠: list已按日期倒序; 返回html(不含table外壳)
  if(!list.length)return "";
  const days=[];let cur=null,day=null;
  list.forEach(r=>{const d=r[dateKey];
    if(d!==cur){day={date:d,rows:[]};days.push(day);cur=d}
    day.rows.push(r)});
  const td=today();
  window.FOLD_TAB=window.FOLD_TAB||{};
  return days.map((day,i)=>{
    const key=day.date+"#"+(window.FOLD_TAB_CTX||"");
    if(window.FOLD_TAB[key]===undefined)window.FOLD_TAB[key]=(i<2?1:0);
    const open=!!window.FOLD_TAB[key];
    const label=day.date===td?"今天 "+day.date.slice(5):day.date.slice(5);
    const sum=sumFn?sumFn(day.rows):day.rows.length+"笔";
    const head=`<tr style="background:#F0E9DC;cursor:pointer" onclick="foldToggle('${key.replace(/'/g,"")}')"><td colspan="${window.FOLD_TAB_COLS||5}"><b>${open?"▾":"▸"} ${label}</b> <small style="color:#888">${sum}</small></td></tr>`;
    const rows=open?day.rows.map(rowFn).join(""):`<tr><td colspan="${window.FOLD_TAB_COLS||5}" style="color:#AAA;font-size:11px;padding:4px 8px">— ${hintText||"已折叠, 点日期行展开"} —</td></tr>`;
    return head+rows}).join("")}
function feedTable(){if(!S.feedLog.length)return `<div class="empty">还没有记录</div>`;
  const list=[...S.feedLog].sort((a,b)=>a.date<b.date?1:-1);
  // 分日统计
  const days=[]; let cur=null,day=null;
  list.forEach(r=>{const j=r.jin!==undefined?r.jin:(+r.qty);const isOut=r.dir.startsWith("出");
    if(r.date!==cur){day={date:r.date,rows:[],in:0,out:0};days.push(day);cur=r.date}
    if(isOut)day.out+=j;else day.in+=j;
    day.rows.push({r,j,isOut})});
  // 折叠状态: 全局 FOLD_FEED={date:1展开}; 默认前2天展开, 其余收
  window.FOLD_FEED=window.FOLD_FEED||{};
  if(window.FOLD_FEED._init!==list[0].date+list.length){window.FOLD_FEED={_init:list[0].date+list.length};
    days.forEach((d,i)=>window.FOLD_FEED[d.date]=i<2?1:0)}
  const td=today();
  let ind=0,oud=0;
  const blocks=days.map((d,i)=>{
    d.rows.forEach(x=>{if(x.isOut)oud+=x.j;else ind+=x.j});
    const open=!!window.FOLD_FEED[d.date];
    const label=d.date===td?"今天 "+d.date.slice(5):d.date.slice(5);
    const head=`<tr style="background:#F0E9DC;cursor:pointer" onclick="foldFeed('${d.date}')"><td colspan="5"><b>${open?"▾":"▸"} ${label}</b> <small style="color:#888">${d.rows.length}笔 · <span style="color:#2E7D32">入${fmt(d.in)}斤</span> <span style="color:#B3261E">出${fmt(d.out)}斤</span></small></td></tr>`;
    const rows=open?d.rows.map(x=>`<tr><td>${x.r.item}</td><td style="color:${x.isOut?"#B3261E":"#2E7D32"}">${x.isOut?"出":"入"}</td><td class="money">${x.isOut?"−":"+"}${fmt(x.r.qty)} ${x.r.unit||"斤"}<small style="color:#888"> ${fmt(x.j)}斤</small></td><td>${x.r.note||""}</td><td class="row-actions"><button class="mini" onclick="editFeedRow('${x.r.id}')" title="修改">✏️</button><button class="del" onclick="delRow('feedLog','${x.r.id}')">删</button></td></tr>`).join(""):
      `<tr><td colspan="5" style="color:#AAA;font-size:11px;padding:4px 8px">— 已折叠, 点日期行展开 —</td></tr>`;
    return head+rows}).join("");
  return `<table><tr><th>物料</th><th></th><th>数量</th><th>备注</th><th></th></tr>${blocks}<tr style="background:#F0E9DC"><td colspan="2"><b>累计</b></td><td class="money"><b style="color:#2E7D32">入${fmt(ind)}斤</b> <b style="color:#B3261E">出${fmt(oud)}斤</b></td><td colspan="2"><b>净余 ${fmt(ind-oud)}斤</b> <small style="color:#888">(=当前库存总斤)</small></td></tr></table><div class="hint">点日期行可折叠/展开; 默认展开最近两天, 其余收起。</div>`}

// 原料价: feedLog 里入库且填了单价 (元/斤); 鸡蛋价: sales (元/斤, 枚/件折算或单独看)
function periodKey(date,mode){const y=date.slice(0,4),m=+date.slice(5,7);
  if(mode==="月")return date.slice(0,7);
  if(mode==="季")return y+" Q"+Math.ceil(m/3);
  return y}
function priceStats(list,dateF,pF,mode,weightF){ // 加权平均: 权重=数量
  const t={};
  for(const r of list){const p=+pF(r);if(!p||p<=0)continue;const k=periodKey(dateF(r),mode);
    (t[k]=t[k]||{wsum:0,w:0,n:0});t[k].wsum+=p*(weightF?weightF(r):1);t[k].w+=(weightF?weightF(r):1);t[k].n++}
  return Object.keys(t).sort().map(k=>({k,avg:r2(t[k].wsum/t[k].w),n:t[k].n}))
}
function deltaLine(arr){ // 相邻两期涨跌
  if(!arr||arr.length<2)return "";
  const a=arr[arr.length-2].avg,b=arr[arr.length-1].avg;
  const pct=a?r2((b-a)/a*100):0;
  return `<span class="tag ${b>=a?'up':'dn'}">${b>=a?"▲":"▼"} ${Math.abs(pct)}%</span> 较上期${b>=a?"涨":"跌"} ${fmt(r2(Math.abs(b-a)))} 元`}
function priceChart(arr,unit,color){ // 纯CSS柱状图, 无外部库
  if(!arr.length)return `<div class="empty">暂无带单价的数据 — 去「饲料物料」入库时填单价, 或「鸡蛋销售」记每笔单价</div>`;
  const max=Math.max(...arr.map(x=>x.avg)),min=Math.min(...arr.map(x=>x.avg));
  const span=(max-min)||1;
  const bars=arr.map((x,i)=>{const h=18+Math.round((x.avg-min)/span*82); // 18%~100%高度
    const up=i>0&&x.avg>=arr[i-1].avg;
    return `<div class="barwrap"><div class="barval">${x.avg}</div><div class="bar" style="height:${h}%;background:${up?color:'#CC8B6B'}"></div><div class="barlab">${x.k.replace(new RegExp('^'+arr[0].k.slice(0,4)),'')}</div><div class="barn">${x.n}笔</div></div>`}).join("");
  return `<div class="chart">${bars}</div><div class="hint">柱高=价格水平; 橙色柱=比上期涨, 棕色柱=跌。单价区间 ${min}~${max} ${unit}。</div>`}

// ================= ☁️ GitHub 私库加密同步 =================
// 原理: 账本JSON -> 用App密码经PBKDF2派生密钥 -> AES-GCM加密 -> base64 -> 存GitHub私库data.json
// 云端只有密文; 同一台"密码"才能解开. token只存本机.
const SYNC_REPO="zhaoyu-12/eggxiaogu-sync";
async function deriveKey(pw,salt){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:150000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function encData(obj,pw){
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await deriveKey(pw,salt);
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(JSON.stringify(obj)));
  const all=new Uint8Array(16+12+ct.byteLength);all.set(salt,0);all.set(iv,16);all.set(new Uint8Array(ct),28);
  return btoa(String.fromCharCode(...all))}
async function decData(b64,pw){
  const raw=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  const salt=raw.slice(0,16),iv=raw.slice(16,28),ct=raw.slice(28);
  const key=await deriveKey(pw,salt);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct);
  return JSON.parse(new TextDecoder().decode(pt))}
async function ghGet(){ // 拉云端密文(404=云端还没有)
  const t=S.sync.token;const r=await fetch(`https://api.github.com/repos/${SYNC_REPO}/contents/data.json`,{cache:"no-store",headers:{Authorization:`token ${t}`}});
  if(r.status===404)return null;if(!r.ok)throw new Error("读取失败 "+r.status);
  const j=await r.json();return {b64:j.content.replace(/\s/g,""),sha:j.sha}}
async function ghDelete(sha){ // 删云端密文(重置云端用)
  const t=S.sync.token;
  const r=await fetch(`https://api.github.com/repos/${SYNC_REPO}/contents/data.json`,{method:"DELETE",headers:{Authorization:"Bearer "+t,"Content-Type":"application/json"},body:JSON.stringify({message:"重置云端(忘记密码)",sha})});
  if(r.status===200)return true;throw new Error("删除失败 "+r.status)}
async function ghPut(b64,sha){ // 推密文
  const t=S.sync.token;
  const body={message:"账本同步 "+new Date().toISOString().slice(0,16).replace("T"," "),content:b64};
  if(sha)body.sha=sha;
  const r=await fetch(`https://api.github.com/repos/${SYNC_REPO}/contents/data.json`,{method:"PUT",headers:{Authorization:`token ${t}`,"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok)throw new Error("上传失败 "+r.status);return (await r.json()).content.sha}
let LAST_SYNC_MSG="",LAST_SYNC_ERR=false;

async function mergePull(pw){ // 拉云端, 与本机双向合并(按记录id去重, 互不覆盖, 新账号另算)
  const cur=await ghGet();if(!cur)return {merged:0};
  let remote;try{remote=await decData(cur.b64,pw)}catch(e){throw new Error("解不开——密码不对")}
  let added=0;
  // 数组类: 双向按 id 并集; 标量类(flock 计划/疫苗计划): remote 有本机没有的 key 才收
  const arrays=["flock","feedLog","finance","sales","vaccines"];
  arrays.forEach(k=>{
    const R=remote[k]||[],L=S[k]||[];
    const ids=new Set(L.map(r=>r.id).filter(Boolean));
    const inc=R.filter(r=>!r.id||!ids.has(r.id));
    if(inc.length){added+=inc.length;S[k]=L.concat(inc)}})
  Object.keys(remote.plan||{}).forEach(k=>{if(!(k in (S.plan||{})))S.plan[k]=remote.plan[k]});
  (remote.vaccines||[]).forEach(()=>{});
  return {merged:added}}

async function doPush(isAuto){ // 上传(自动/手动共用): 先拉云端合并, 再整包加密推回
  if(!S.sync||!S.sync.token)throw new Error("请先填入同步令牌");
  const pwEl=document.getElementById("sync_pw");
  let pw=isAuto?(S.sync.pw||""):(pwEl&&pwEl.value||S.sync.pw||"");
  if(!pw)throw new Error("请输入加密密码");

  const cur=await ghGet();
  if(cur){try{await decData(cur.b64,pw)}catch(e){
    if(isAuto){S.sync.auto=false;save();throw new Error("云端密码与本机不一致, 已暂停自动同步")}

  S.sync.lastUp=new Date().toISOString();S.sync.sha=sha;save();
  if(!isAuto)syncMsg(`✅ 上传成功(${new Date().toLocaleString("zh-CN",{hour12:false})})。另一台设备上点「下载同步」即可拉取。`);

async function autoPull(){ // 打开App时自动收: 拉云端→按id合并→若并了新记录则重算库存→再回推

  try{
    if(!S.sync||!S.sync.token){syncMsg("请先填入同步令牌",true);return}
    const pw=document.getElementById("sync_pw").value;
    if(!pw){syncMsg("请输入解密密码(上传时用的那个)",true);return}
    syncMsg("⏳ 正在下载并解密…");
    const cur=await ghGet();
    if(!cur){syncMsg("云端还没有账本。请先在有数据的设备上「上传到云端」。",true);return}
    let remote;
    try{remote=await decData(cur.b64,pw)}catch(e){syncMsg("❌ 解不开——密码不对, 或这份密文是别的密码锁的。",true);return}
    const nR=(remote.feedLog||[]).length+(remote.sales||[]).length+(remote.finance||[]).length;
    const nL=S.feedLog.length+S.sales.length+S.finance.length;
    if(!confirm(`云端账本: 流水约 ${nR} 笔(存栏${(remote.flock||[]).reduce((a,r)=>a+r.qty,0)}只)\n本机账本: 流水约 ${nL} 笔\n\n用云端覆盖本机? 本机现有数据会先自动导出一份备份。`))return;
    exportData(true); // 静默导出保底
    const keep={sync:S.sync,auth:S.auth};
    S=Object.assign(JSON.parse(JSON.stringify(EMPTY)),remote);
    S.sync=keep.sync;S.auth=keep.auth||S.auth;
    if(!S.consume)S.consume={};if(!S.recipe)S.recipe=null;
    S.sync.sha=cur.sha;S.sync.lastDown=new Date().toISOString();save();
    syncMsg(`✅ 下载并恢复成功(${new Date().toLocaleString("zh-CN",{hour12:false})})。`);render()}
  catch(e){syncMsg("❌ "+e.message,true)}}

function vBak(){
  const sc=S.sync||{};
  const syncHtml=`
  <section class="panel"><h2>☁️ 多设备同步(GitHub 加密私库)</h2>
  ${sc.token?`<div style="margin-bottom:6px"><span class="tag s">● 已配置</span> ${sc.lastUp?`上次上传 ${new Date(sc.lastUp).toLocaleString("zh-CN",{hour12:false})}`:"尚未上传"} ${sc.lastDown?` · 上次下载 ${new Date(sc.lastDown).toLocaleString("zh-CN",{hour12:false})}`:""}</div>`:`<div class="hint" style="margin-bottom:6px">首次使用: 在 GitHub 网页登录后打开 <b>github.com/settings/tokens/new</b> → 勾选 <b>repo</b> 权限 → 生成令牌并复制(ghp_开头, 只显示一次)。这是您设备的"同步钥匙"。</div>`}
  ${sc.token?"":`<form onsubmit="syncSetup(event)"><div class="field"><label>同步令牌(ghp_开头)</label><input type="password" name="token" placeholder="粘贴 GitHub 令牌" required></div><button class="go">保存令牌</button></form>`}
  ${sc.token?`
  <div class="field"><label>加密密码(两台设备必须一致) <small id="pw_len" style="color:var(--sub)"></small></label><input type="password" id="sync_pw" value="${sc.pw||""}" placeholder="上传/解开账本用的密码" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" oninput="document.getElementById('pw_len').textContent=this.value.length+'字符'"></div>
  <button type="button" class="mini" onclick="var p=document.getElementById('sync_pw');p.type=p.type==='password'?'text':'password';">👁 显示/隐藏密码</button>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px">
    <label style="display:flex;align-items:center;gap:4px"><input type="checkbox" id="sync_auto" ${sc.auto?"checked":""} onchange="syncAutoToggle(this.checked)"> 自动同步(记账即传, 打开即收)</label>
  </div>
  <div style="display:flex;gap:8px"><button class="go" onclick="syncUp()">⬆️ 立即上传</button><button class="mini" onclick="syncDown()">⬇️ 整包覆盖(搬家用)</button><button class="mini" onclick="syncMergeNow()">⬇️⬆️ 拉取合并</button>
    <button class="mini" style="color:#B3261E" onclick="resetSyncCloud()">忘记密码?重置云端</button></div>`:""}
  <div id="sync_msg">${LAST_SYNC_MSG?`<div class="hint" style="color:${LAST_SYNC_ERR?'#B3261E':'#2E7D32'}">${LAST_SYNC_MSG}</div>`:""}</div>
  <div class="hint">账本先用密码加密再上传, 云端私库只有乱码。用法: 老设备「上传」→ 新设备「下载」; 平时哪台记完传一次。令牌只存本机, 清缓存后需重填一次。手机号都不用注册——GitHub 账号咱已经有了。</div></section>`;
  return syncHtml+`<section class="panel"><h2>📤 导出备份</h2>
  <button class="go" onclick="exportData()">下载备份文件 (.json)</button>
  <div class="hint">数据存在浏览器里, 换电脑/清缓存会丢。建议每月导出一次, 存到微信文件传输助手或U盘。</div></section>
  <section class="panel"><h2>📥 导入恢复</h2>
  <input type="file" accept=".json" onchange="importData(event)">
  <div class="hint">导入会覆盖当前数据, 导入前先导出一份。</div></section>
  <section class="panel"><h2>⚠️ 清空数据</h2>
  <button class="mini" style="color:#C96A6A;border-color:#E5B4B4" onclick="if(confirm('确定清空全部数据? 此操作不可恢复!')&&confirm('再次确认: 真的清空?')){localStorage.removeItem(KEY);sessionStorage.removeItem('gx_login');location.reload()}">清空全部数据</button></section>
  <section class="panel"><h2>🔒 密码与锁屏</h2>
    <button class="go" onclick="lockNow()">立即锁屏</button>
    <div class="hint">锁屏后需输入密码再进。忘密码: 锁屏后点「忘记密码」答密保问题即可重设, 数据不动。密保答案散列存本机, 无法查看原文。</div></section>`;
}

// ================= 增删 =================
function fd(f){const o={};new FormData(f).forEach((v,k)=>{if(k.endsWith("_c"))return;o[k]=typeof v==="string"?v.trim():v});f.querySelectorAll("select").forEach(s=>{if(s.value==="__custom__"){const c=f.querySelector(`[name="${s.name}_c"]`);o[s.name]=c&&c.value.trim()?c.value.trim():""}delete o[s.name+"_c"]});return o}
function addFlock(e){e.preventDefault();const d=fd(e.target);const flid=uid();S.flock.push({id:flid,...d,qty:+d.qty});let fm="";
  if(+d.amount>0){const amt=r2(+d.amount);const isSell=(d.type||"").indexOf("出售")>=0;
    S.finance.push({id:uid(),date:d.date,kind:isSell?"收":"支",cat:"鸡苗/淘鸡",item:isSell?"淘鸡收入":"进雏支出",amount:amt,pay:"paid",note:`自动记账 · ${d.type}${Math.abs(+d.qty)}只(${d.house||""})`,src:"flock:"+flid});
    fm=`; 收支台账已自动记${isSell?"收入":"支出"} ¥${fmt(amt)}`}
  touchSave();render()}
function addFeed(e){e.preventDefault();const d=fd(e.target);const f=e.target;
  const sel=f.querySelector('select[name="item"]');const c=f.querySelector('[name="item_c"]');
  const item=(sel&&sel.value==="__custom__")?(c&&c.value.trim()||""):(sel&&sel.value||""); // smartField取真名
  if(!item){alert("请填写物料名");return}
  if(sel&&sel.value==="__custom__"&&item){S.customFeed=S.customFeed||[];if(!S.customFeed.includes(item)&&!FEED_ITEMS.includes(item)){S.customFeed.push(item);save()}}
  const qty=+d.qty;if(!(qty>0)){alert("数量要大于0");return}
  if(!d.unit||d.unit==="undefined"){alert("单位无效, 请重新选择单位");return}
  let jin=0;let kgo=0;
  if(d.unit==="包"){kgo=+d.bagkg>0?+d.bagkg:bagKgOf(item);if(!(kgo>0)){alert("请填写每包重量");return}jin=r2(qty*kgo*2);rememberBagKg(item,kgo)}
  else if(unitIsCustom(d.unit)){const uk=+d.unitkg;if(!(uk>0)){alert(`请填写每${d.unit}重量(kg)`);return}jin=r2(qty*uk*2);rememberUnitKg(item,d.unit,uk)}
  else {jin=r2(qty*(unitJinOf(item,d.unit)||1))}
  const out=d.dir.startsWith("出");S.feedStock[item]=r2((S.feedStock[item]||0)+(out?-jin:jin));
  if(S.feedStock[item]<0&&!confirm(`${item}库存将变为${S.feedStock[item]}斤(负数, 可能漏记了入库), 仍要继续吗?`)){S.feedStock[item]=r2(S.feedStock[item]+(out?jin:-jin));return}
  const fid=uid();
  S.feedLog.push({id:fid,date:d.date,item,dir:d.dir,qty,unit:d.unit||"斤",jin,price:d.price,note:(d.unit==="包"?`每包${kgo}kg`:(unitIsCustom(d.unit)&&d.unitkg?`每${d.unit}${d.unitkg}kg`:""))+(d.note?" "+d.note:"")});
  let finMsg="";
  if(!out&&+d.price>0){ // 入库带单价 → 自动记一笔支出到收支台账
    const amt=r2(qty*(+d.price));
    S.finance.push({id:uid(),date:d.date,kind:"支",cat:"饲料原料",item,amount:amt,pay:"paid",note:`自动记账 · 入库${qty}${d.unit}`,src:"feed:"+fid});
    finMsg=`; 收支台账已自动记支出 ¥${fmt(amt)}`}
  touchSave();
  syncMsg(`✅ 已记账: ${d.date} ${item} ${out?"出":"入"}库 ${qty}${d.unit}(${fmt(jin)}斤)${(d.unit==="包"&&d.bagkg)?`, 每包${d.bagkg}kg`:(unitIsCustom(d.unit)&&d.unitkg?`, 每${d.unit}${d.unitkg}kg`:"")}${finMsg}`);
  f.reset();f.querySelector('[name="date"]').value=today();
  const bg=f.querySelector("#bagkg_field");if(bg)bg.style.display="none";const ukf=f.querySelector("#unitkg_field");if(ukf)ukf.style.display="none";const pl=f.querySelector("#price_label");if(pl)pl.textContent="单价(元/斤)";
  render()}
function addFin(e){e.preventDefault();const d=fd(e.target);S.finance.push({id:uid(),...d,amount:r2(+d.amount),pay:d.pay||"paid"});touchSave();render()}
function addSale(e){e.preventDefault();const d=fd(e.target);const rec={id:uid(),...d,qty:+d.qty,price:+d.price,pay:d.pay||"paid"};if(+d.mkt)rec.mkt=+d.mkt;S.sales.push(rec);touchSave();
  if(rec.pay==="credit")syncMsg(`已记账(赊账): ${d.channel} ${rec.qty}${d.unit} ¥${fmt(salesAmt(rec))} — 待收款, 记得去「欠款」页平账`);
  render()}
function addVax(e){e.preventDefault();const d=fd(e.target);const vid=uid();S.vaccines.push({id:vid,...d});let vm="";
  if(+d.amount>0){const amt=r2(+d.amount);S.finance.push({id:uid(),date:d.date,kind:"支",cat:"疫苗兽药",item:d.name||"疫苗药品",amount:amt,pay:"paid",note:"自动记账 · 防疫用药",src:"vax:"+vid});vm=`; 收支台账已自动记支出 ¥${fmt(amt)}`}
  touchSave();
  if(S.plan&&S.plan.start&&d.name){ // 与计划项同名且日期吻合 → 自动勾掉计划进度
    const hit=planAll().find(it=>it.name===d.name.trim()&&addDays(S.plan.start,it.d)===d.date);
    if(hit){S.plan.done=S.plan.done||[];const k=String(hit.cid||hit.d);if(!S.plan.done.includes(k)){S.plan.done.push(k);touchSave()}}
  }
  if(vm)syncMsg("✅ 已记防疫"+vm.slice(1));render()}
function delRow(arr,id){if(!confirm("删除这条记录?"))return;
  if(arr==="vaccines"){ // 删免疫流水时, 若它源自计划表, 同步撤销计划进度
    const rec=(S.vaccines||[]).find(r=>r.id===id);
    if(rec&&S.plan&&S.plan.start&&(rec.note||"").indexOf("免疫")>=0){
      const hit=planAll().find(it=>it.name===rec.name&&addDays(S.plan.start,it.d)===rec.date);
      if(hit){const k=String(hit.cid||hit.d);S.plan.done=(S.plan.done||[]).map(String).filter(x=>x!==k)}
    }
  }
  S[arr]=S[arr].filter(r=>r.id!==id);touchSave();render()}
function editFeedRow(id){ // 出入库流水行内编辑: 库存先按旧账回冲, 存好再按新账重扣
  const r=S.feedLog.find(x=>x.id===id);if(!r)return;
  const ni=prompt("物料名",r.item);if(ni===null)return;const item=ni.trim();if(!item)return;
  const nd=prompt("方向: 入库 / 出库(饲喂)",r.dir);if(nd===null)return;const dir=nd.trim()||r.dir;
  const nq=prompt(`数量(${r.unit||"斤"})`,r.qty);if(nq===null)return;const qty=+nq;if(!(qty>0)){alert("数量要大于0");return}
  let unit=r.unit||"斤";
  if(unit==="包"){const nk=prompt("每包重量(kg)",(S.bagKgMap||{})[item]||bagKg());if(nk===null)return;const kg=+nk;if(!(kg>0)){alert("包重要大于0");return}rememberBagKg(item,kg)}
  const jin=(unit==="包")?r2(qty*((S.bagKgMap||{})[item]||bagKg())*2):r2(qty*(FEED_UNITS.find(x=>x[0]===unit)||[0,1])[1]);
  const oldJin=r.jin!==undefined?r.jin:(+r.qty);const wasOut=(r.dir||"").startsWith("出");
  S.feedStock[r.item]=r2((S.feedStock[r.item]||0)+(wasOut?oldJin:-oldJin)); // 回冲旧账
  const isOut=dir.startsWith("出");S.feedStock[item]=r2((S.feedStock[item]||0)+(isOut?-jin:jin)); // 记新账
  r.item=item;r.dir=dir;r.qty=qty;r.unit=unit;r.jin=jin;
  touchSave();syncMsg(`✅ 已改: ${r.date} ${item} ${isOut?"出":"入"}库 ${qty}${unit}(${fmt(jin)}斤)`);
  render()}
function exportData(silent){const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`蛋小固管家备份_${today()}.json`;if(silent)return;a.click()}
function importData(e){const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!confirm("导入将覆盖当前数据, 继续?"))return;S=Object.assign(JSON.parse(JSON.stringify(EMPTY)),d);save();location.reload()}catch(err){alert("文件不是有效备份: "+err.message)}};rd.readAsText(f)}
function afterRender(){}
