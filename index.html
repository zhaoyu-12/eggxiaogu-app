<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4A2F12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="蛋小固">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<title>蛋小固 · 蛋鸡场管家</title>
<style>
  :root{
    --bg:#F6F1E7; --card:#FFFFFF; --ink:#3D2B12; --sub:#8A7357;
    --line:#EADFCB; --brand:#D97A1F; --brand2:#F0A63C; --brand-soft:#FBF0DC;
    --green:#2E8B57; --red:#CC4B4B; --red-soft:#FDEEEE; --th:#F8F0DE;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
  /* ---- 顶栏: 咖啡棕渐变 + 琥珀光 ---- */
  header{background:linear-gradient(135deg,#4A2F12 0%,#7A4A16 100%);color:#fff;padding:16px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(74,47,18,.25)}
  header .logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#F5A623,#E8862E);display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
  header h1{font-size:20px;font-weight:700;letter-spacing:.5px}
  header .sub{font-size:12px;opacity:.85;margin-top:1px}
  /* ---- 导航: 横滑药丸 ---- */
  nav{display:flex;gap:7px;padding:11px 14px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:9;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;color:var(--ink);padding:8px 15px;border-radius:99px;font-size:14px;cursor:pointer;transition:all .15s}
  nav button.active{background:linear-gradient(135deg,var(--brand2),var(--brand));border-color:transparent;color:#fff;font-weight:600;box-shadow:0 2px 6px rgba(217,122,31,.35)}
  main{padding:14px;max-width:960px;margin:0 auto;padding-bottom:70px}
  /* ---- 数据卡 ---- */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;margin-bottom:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 15px;box-shadow:0 1px 4px rgba(90,60,20,.05)}
  .card .num{font-size:25px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.3px}
  .card .lab{font-size:13px;color:var(--sub);margin-top:2px}
  .card.good .num{color:var(--green)}
  .card.warn{border-color:#F0C9C9;background:var(--red-soft)}
  .card.warn .num{color:var(--red)}
  /* ---- 面板 ---- */
  section.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:14px;box-shadow:0 1px 4px rgba(90,60,20,.05)}
  .panel h2{font-size:16px;font-weight:700;margin-bottom:11px;display:flex;align-items:center;gap:6px;letter-spacing:.3px}
  /* ---- 表单 ---- */
  form{display:flex;flex-wrap:wrap;gap:9px;align-items:flex-end}
  .field{display:flex;flex-direction:column;gap:3px;flex:0 1 auto}
  .field label{font-size:12px;color:var(--sub);font-weight:600}
  input,select{border:1.5px solid var(--line);border-radius:10px;padding:8px 11px;font-size:15px;background:#FFFDF8;color:var(--ink);min-width:105px;transition:border .15s}
  input:focus,select:focus{outline:none;border-color:var(--brand2);box-shadow:0 0 0 3px rgba(240,166,60,.15)}
  input[type=date]{min-width:132px}
  button.go{background:linear-gradient(135deg,var(--brand2),var(--brand));border:none;color:#fff;font-size:15px;font-weight:600;padding:9px 20px;border-radius:10px;cursor:pointer;box-shadow:0 2px 6px rgba(217,122,31,.3);transition:transform .1s}
  button.go:active{transform:scale(.96)}
  button.mini{background:#fff;border:1.5px solid var(--line);color:var(--sub);font-size:13px;padding:5px 11px;border-radius:9px;cursor:pointer}
  /* ---- 表格 ---- */
  table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
  th{background:var(--th);color:var(--sub);font-weight:600;padding:8px 9px;text-align:left;white-space:nowrap;border-radius:0}
  td{padding:8px 9px;border-top:1px solid #F3EADA}
  tbody tr:nth-child(even) td{background:#FCF9F2}
  tr:hover td{background:var(--brand-soft)}
  .money{font-variant-numeric:tabular-nums;font-weight:600}
  .neg{color:var(--red)}.pos{color:var(--green)}
  .tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:500}
  .tag.w{background:var(--red-soft);color:var(--red)}
  .tag.s{background:#FFF4DC;color:#B87A10}
  .tag.ok{background:#EAF6EE;color:var(--green)}
  .tag.up{background:#EAF6EE;color:var(--green)}
  .tag.dn{background:var(--red-soft);color:var(--red)}
  /* ---- 行情图表 ---- */
  .bigprice{font-size:30px;font-weight:700;color:var(--ink);margin:6px 0 2px}
  .bigprice small{font-size:14px;color:var(--sub);font-weight:400}
  .chart{display:flex;align-items:flex-end;gap:6px;height:150px;padding:8px 4px 0;overflow-x:auto}
  .barwrap{flex:0 0 44px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:40px}
  .barval{font-size:11px;font-weight:600;color:var(--ink);margin-bottom:3px}
  .bar{width:26px;border-radius:6px 6px 2px 2px;min-height:18px}
  .barlab{font-size:10px;color:var(--sub);margin-top:4px;white-space:nowrap}
  .barn{font-size:9px;color:#C5B79F}
  button.mini.active{background:var(--brand);border-color:var(--brand);color:#fff}
  .empty{text-align:center;color:#B49B72;padding:26px 0;font-size:14px}
  .hint{font-size:12px;color:#A78B5F;margin-top:9px;line-height:1.7}
  .del{color:#C96A6A;cursor:pointer;font-size:13px;background:none;border:none;text-decoration:underline}
  .row-actions{white-space:nowrap}
  @media(max-width:640px){
    nav button{padding:7px 12px;font-size:13px}
    .card .num{font-size:21px}
    table{font-size:12.5px}th,td{padding:6px 5px}
    input,select{min-width:90px;font-size:15px}
    .cards{grid-template-columns:1fr 1fr}
  }
</style>
</head>

// ================= 登录锁 (SHA-256 本地散列, 无服务器; 支持密保问题找回) =================
async function sha256(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s.trim().toLowerCase()));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function loggedIn(){return sessionStorage.getItem("gx_login")==="1"}
function hasAuth(){return S.auth&&S.auth.hash}
function hasSecQ(){return hasAuth()&&S.auth.q&&S.auth.a}
async function tryLogin(e){e.preventDefault();const fd=new FormData(e.target);const pw=fd.get("pw");const h=await sha256(pw);
  if(hasAuth()){if(h===S.auth.hash){sessionStorage.setItem("gx_login","1");bootApp()}else{document.getElementById("login_err").style.display="";}}
  else{if(!pw||pw.length<4){document.getElementById("login_err").textContent="密码至少4位";document.getElementById("login_err").style.display="";return}
    if(pw!==fd.get("pw2")){document.getElementById("login_err").textContent="两次输入不一致";document.getElementById("login_err").style.display="";return}
    const q=fd.get("secq"),a=fd.get("seca");
    if(!q||!a||!a.trim()){document.getElementById("login_err").textContent="请设置密保问题和答案(用于忘密码找回)";document.getElementById("login_err").style.display="";return}
    S.auth={hash:h,set:today(),q,a:await sha256(a)};save();sessionStorage.setItem("gx_login","1");bootApp()}}
async function recoverPw(e){e.preventDefault();const fd=new FormData(e.target);const a=fd.get("ra");
  const h=await sha256(a);
  if(!hasSecQ()||h!==S.auth.a){document.getElementById("rec_err").textContent="答案不对";document.getElementById("rec_err").style.display="";return}
  const p1=fd.get("np1"),p2=fd.get("np2");
  if(!p1||p1.length<4){document.getElementById("rec_err").textContent="新密码至少4位";document.getElementById("rec_err").style.display="";return}
  if(p1!==p2){document.getElementById("rec_err").textContent="两次输入的新密码不一致";document.getElementById("rec_err").style.display="";return}
  S.auth.hash=await sha256(p1);save();sessionStorage.setItem("gx_login","1");bootApp()}

        <input type="password" name="np1" placeholder="新密码(至少4位)" style="text-align:center;font-size:15px" required>
        <input type="password" name="np2" placeholder="再输一遍新密码" style="text-align:center;font-size:15px" required>
        <button class="go" style="width:100%;background:var(--green)">验证密保, 重设密码</button>
      </form>`:`<button class="mini" onclick="resetPw()">清空数据并重设密码</button>`}
      <div id="rec_err" style="display:none;color:var(--red);font-size:13px;margin-top:8px">答案不对</div>
    </div>
    ${hasAuth()?`<div style="margin-top:12px"><button class="mini" onclick="showRecover()">忘记密码?</button></div>`:""}
    <div class="hint" style="text-align:left;margin-top:14px">密码只存本机, 密保答案也只存本机(散列)。${hasAuth()?"忘了密码点「忘记密码」答密保题即可重设, 账本不动。":"密保问题用于日后忘密码找回, 务必填一个忘不了的答案。"}</div>

function bootApp(){backfillConsume();document.getElementById("nav").style.display="";render();
  if(syncOn())setTimeout(()=>{autoPull().catch(e=>console.log("自动同步(收)暂缓:",e.message))},800)}

// ================= 框架 =================
const TABS=["dash","flock","feed","finance","sales","vax","plan","stat","bak"];
let tab="dash";
function renderNav(){document.getElementById("nav").innerHTML=TABS.map(t=>`<button class="${t===tab?'active':''}" onclick="go('${t}')">${CN[t]}</button>`).join("")}
function go(t){tab=t;renderNav();render()}
function render(){if(RECIPE_DRAFT&&document.querySelector('form[onsubmit="saveRecipe(event)"]'))harvestDraft();const m=document.getElementById("main");m.innerHTML=({dash:vDash,flock:vFlock,feed:vFeed,finance:vFin,sales:vSales,vax:vVax,plan:vPlan,stat:vStat,bak:vBak})[tab]();afterRender()}

// ================= 计算层 =================
function stockCount(){return S.flock.reduce((a,r)=>a+r.qty,0)}
function stockOn(day){return S.flock.reduce((a,r)=>a+(r.date<=day?+r.qty:0),0)}
function bagKg(){const v=+S.bagkg;return v>0?v:50} // 默认包重(kg), 新物料/未记过的用它
function bagKgOf(item){const m=(S.bagKgMap||{})[item];return (+m>0)?+m:bagKg()} // 物料自己的包重优先
function setBagKg(){const el=document.getElementById("bagkg_in");const v=+el.value;if(!(v>0)){alert("包重要大于0");return}S.bagkg=v;touchSave();render()}
function rememberBagKg(item,kg){if(!item||!(kg>0))return;S.bagKgMap=S.bagKgMap||{};S.bagKgMap[item]=kg}
function feedUnitUI(sel){const f=document.getElementById("bagkg_field");if(f)f.style.display=sel.value==="包"?"":"none";feedItemTip(document.querySelector('input[name="item"]')?.value)}
function feedItemTip(v){const m=(S.bagKgMap||{})[v];const el=document.getElementById("feed_bagkg");if(m&&el&&(el.value===""||+el.value===bagKg()))el.value=m} // 选老物料自动带出它的包重
function monthSum(list,dateKey,amtFn,m){return list.filter(r=>monthOf(r[dateKey])===m).reduce((a,r)=>a+(amtFn?amtFn(r):r.amount),0)}
function salesAmt(r){return r2(r.qty*r.price)}
function lowFeed(){const R=recipeGet();if(R.total>0&&R.rows.length){const ia=invAlerts().filter(a=>a.lvl==="r").map(a=>a.txt.split(" ")[0]);if(ia.length)return ia}return Object.entries(S.feedStock).filter(([k,v])=>v<=100).map(([k])=>k)}
// ================= 混合料配方 + 每日自动消耗 =================
// recipe = {total:每日总耗(斤), rows:[{item,pct}], per:每只日耗(两/只, 仅展示), enabled:true}
function recipeGet(){if(!S.recipe)S.recipe={total:0,rows:[],enabled:true};if(!S.recipe.rows)S.recipe.rows=[];return S.recipe}
// 配方编辑行(编辑期间暂存, 与 S.recipe 分离, 保存才生效)
let RECIPE_DRAFT=null;
function draftRows(){if(!RECIPE_DRAFT)RECIPE_DRAFT=(S.recipe&&S.recipe.rows.length?[...S.recipe.rows.map(r=>({...r}))]:[{item:"",pct:""},{item:"",pct:""},{item:"",pct:""}]).slice(0,12);return RECIPE_DRAFT}
function harvestDraft(){const f=document.querySelector('form[onsubmit="saveRecipe(event)"]');if(!f||!RECIPE_DRAFT)return;const v={};new FormData(f).forEach((x,k)=>v[k]=x);RECIPE_DRAFT.forEach((r,i)=>{r.item=v["ri"+i]||"";r.b=v["rb"+i]||"";r.k=v["rk"+i]||"";r.pct=v["rp"+i]||""})}
function recipeAddRow(){const d=draftRows();harvestDraft();if(d.length>=12){alert("最多12个品种, 够配预混料了 :)");return}d.push({item:"",pct:""});render()}
function recipeDelRow(i){const d=draftRows();harvestDraft();d.splice(i,1);render()}
function pctFill(){const f=document.querySelector('form[onsubmit="saveRecipe(event)"]');if(!f)return;const d=fd(f);let wsum=0;const w=[];for(let i=0;i<12;i++){const b=+d["rb"+i]||0,nm=(d["ri"+i]||"").trim(),k=+d["rk"+i]||(nm?bagKgOf(nm):bagKg());w.push(b*k);wsum+=b*k}
  if(!(wsum>0)){alert("先在各行填包数(千克/包留空默认50)");return}
  f.querySelectorAll('[name^="rp"]').forEach((el,i)=>{if(w[i]!==undefined)el.value=Math.round(w[i]/wsum*1000)/10});}
function saveRecipe(e){e.preventDefault();const d=fd(e.target);const t=+d.total;
  if(!(t>0)){alert("每日总耗料要大于0");return}
  let rows=[];for(let i=0;i<12;i++){const it=d["ri"+i],pc=+d["rp"+i],b=+d["rb"+i]||0,k=+d["rk"+i]||0;if(it&&pc>0)rows.push({item:it,pct:pc,b:b||undefined,k:b?(k||bagKgOf(it)):undefined})}
  if(!rows.length){let wsum=0;const tmp=[];for(let i=0;i<12;i++){const it=d["ri"+i],b=+d["rb"+i]||0,k=+d["rk"+i]||bagKgOf(it);if(it&&b>0){const w=b*k;tmp.push({item:it,w,b,k});wsum+=w}}if(wsum>0)tmp.forEach(x=>rows.push({item:x.item,pct:r2(x.w/wsum*100),b:x.b,k:x.k}))}
  const sum=rows.reduce((a,r)=>a+r.pct,0);
  if(!rows.length){alert("至少填一行品种");return}
  if(Math.abs(sum-100)>0.5&&!confirm(`品种占比合计 ${sum}%, 不是100%, 仍要保存吗?(系统会按比例折算)`))return;
  rows.forEach(r=>r.pct=r.pct/sum*100);
  S.recipe={total:t,rows,per:+d.per||r2(t/stockCount()*10),enabled:true};RECIPE_DRAFT=null;touchSave();render()}
function recipeToggle(){S.recipe.enabled=!S.recipe.enabled;touchSave();render()}
function runConsume(){ // 手动"记今日消耗"(补记/重记今日; 自动消耗在启动时做)
  const R=recipeGet();if(!R.enabled||!(R.total>0)||!R.rows.length){alert("请先设置配方并启用");return}
  if(!(stockOn(today())>0)){alert("今日没有存栏(鸡未上或已清栏), 不记饲料消耗");return}
  consumeDay(today(),true);render()}
function consumeDay(day,force){ // 把 day 的消耗折成一组出库流水(当日已有则跳过, force 则先撤旧)
  const R=recipeGet();if(!(R.total>0)||!R.rows.length)return false;
  const st=stockOn(day); // 当天存栏(此日前所有栏群变动合计)
  const old=S.feedLog.filter(r=>r.auto&&r.date===day);
  if(old.length){old.forEach(r=>{S.feedStock[r.item]=r2((S.feedStock[r.item]||0)+r.jin)});
    S.feedLog=S.feedLog.filter(r=>!(r.auto&&r.date===day))}
  if(!(st>0))return false; // 鸡未上/已清栏: 不记消耗, 不标记(日后补录上鸡会自动再判)
  const tag=`自动消耗 ${day.slice(5).replace("-","/")}`;
  R.rows.forEach(row=>{const jin=r2(R.total*row.pct/100);if(jin<=0)return;
    S.feedStock[row.item]=r2((S.feedStock[row.item]||0)-jin);
    S.feedLog.push({id:uid(),date:day,item:row.item,dir:"出库(饲喂)",qty:jin,unit:"斤",jin,auto:true,note:tag})});
  S.consume[day]=true;touchSave();return true}
function healBad(){ // 撤销"无鸡日"的自动消耗并回收库存(开机与每次云合并后都要跑, 防云端还魂)
  const bad=S.feedLog.filter(r=>r.auto&&stockOn(r.date)<=0);
  if(!bad.length)return 0;
  bad.forEach(r=>{S.feedStock[r.item]=r2((S.feedStock[r.item]||0)+r.jin)});
  const bd=new Set(bad.map(r=>r.date));S.feedLog=S.feedLog.filter(r=>!(r.auto&&bd.has(r.date)));
  bd.forEach(ds=>{delete S.consume[ds]});return bad.length}
function backfillConsume(){ // 启动时补齐上次用到今天的每日消耗(每次打开最多补7天, 再久提示手动核)
  healBad();
  const R=recipeGet();if(!S.recipe||!R.enabled||!(R.total>0)||!R.rows.length)return;
  const days=[];const d=new Date();
  for(let i=0;i<7;i++){const ds=d.toISOString().slice(0,10);if(!S.consume[ds])days.push(ds);d.setDate(d.getDate()-1)}
  days.reverse().forEach(day=>consumeDay(day,false))}
function feedInv(){ // 库存盘查: 每品种库存/日耗/可撑天数
  const R=recipeGet();const daily={};R.rows.forEach(r=>daily[r.item]=R.total*r.pct/100);
  const items=new Set([...Object.keys(S.feedStock),...Object.keys(daily)]);
  return [...items].map(k=>{const st=S.feedStock[k]||0,d=daily[k]||0;
    const days=d>0?Math.floor(st/d*10)/10:null;
    return {item:k,st,daily:d,days}})}
function invAlerts(){return feedInv().filter(x=>x.daily>0).map(x=>{if(x.days===null)return null;
  if(x.days<0)return {lvl:"r",txt:`${x.item} 已透支 ${fmt(Math.abs(x.st))} 斤(库存为负, 该入库了)`};
  if(x.days<=3)return {lvl:"r",txt:`${x.item} 仅够 ${x.days<1?"不足1":x.days} 天(${fmt(x.st)}斤)`};
  if(x.days<=7)return {lvl:"w",txt:`${x.item} 约 ${x.days} 天(${fmt(x.st)}斤)`};return null}).filter(Boolean)}
function vaxAlerts(){const out=[];const t=today();
  // 来自免疫计划的待办: 未勾选且日期已进入7天窗口或已过期
  if(S.plan&&S.plan.start){for(const it of planAll()){if(S.plan.done&&S.plan.done.includes(it.cid||it.d))continue;const due=addDays(S.plan.start,it.d);if(due<=addDays(t,7))out.push({name:it.name,due,lvl:due<t?"w":"s",txt:`${due<t?"已过期":"计划"} ${due} · ${it.name}(${it.d}日龄)`})}}
  // 来自免疫档案的下次免疫
  for(const v of S.vaccines){if(!v.next)continue;if(v.next<t)out.push({...v,due:v.next,lvl:"w",txt:`已到期 ${v.next} · ${v.name}`});else{const dd=Math.round((new Date(v.next)-new Date(t))/864e5);if(dd<=7)out.push({...v,due:v.next,lvl:"s",txt:`${dd===0?"今天":dd+"天后"} ${v.next} · ${v.name}`})}}
  return out.sort((a,b)=>a.due<b.due?-1:1)}
const addDays=(iso,n)=>{const d=new Date(iso+"T00:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
function planAge(){if(!S.plan||!S.plan.start)return null;return Math.round((new Date(today()+"T00:00:00")-new Date(S.plan.start+"T00:00:00"))/864e5)}
function planDoneCount(){return S.plan&&S.plan.done?S.plan.done.length:0}

// ================= 视图 =================
function vDash(){
  const m=monthOf(today());
  const stock=stockCount();
  const mSale=monthSum(S.sales,"date",salesAmt,m);
  const mExp=monthSum(S.finance,"date",r=>r.kind==="支"?r.amount:0,m);
  const mInc=mSale+S.finance.filter(r=>r.kind==="收"&&monthOf(r.date)===m).reduce((a,r)=>a+r.amount,0);
  const alerts=vaxAlerts();
  const low=lowFeed();
  const kg=s=>s>=2000?(s/2000).toFixed(2)+" 吨":s>=1000?(s/1000).toFixed(1)+" 千斤":fmt(s)+" 斤";
  const stockRows=Object.entries(S.feedStock).filter(([k,v])=>v!==0).map(([k,v])=>`<tr><td>${k}</td><td class="money ${v<=100?'neg':''}">${kg(v)}</td></tr>`).join("")||`<tr><td class="empty">暂无库存记录, 去「饲料物料」进货</td></tr>`;
  const alertHtml=alerts.length?alerts.map(a=>`<div style="margin:4px 0"><span class="tag ${a.lvl}">${a.lvl==="w"?"过期未免":"即将到期"}</span> ${a.txt} <a href="#" onclick="go('vax');return false" style="color:#B87A10;font-size:13px">去记录 →</a></div>`).join(""):`<div class="empty">✅ 近7天无疫苗待办</div>`;
  return `
  <div class="cards">
    <div class="card"><div class="num">${fmt(stock)}</div><div class="lab">栏内存栏(只)</div></div>
    <div class="card good"><div class="num">¥${fmt(mInc)}</div><div class="lab">本月收入</div></div>
    <div class="card"><div class="num">¥${fmt(mExp)}</div><div class="lab">本月支出</div></div>
    <div class="card ${mInc-mExp<0?'warn':'good'}"><div class="num">¥${fmt(r2(mInc-mExp))}</div><div class="lab">本月结余</div></div>
  </div>
  <section class="panel"><h2>💉 疫苗提醒</h2>${alertHtml}</section>
  <section class="panel"><h2>🌾 饲料库存</h2>
    ${low.length?`<div style="margin-bottom:6px"><span class="tag w">需补货</span> ${low.join("、")}</div>`:""}
    <table><tr><th>物料</th><th>当前库存</th></tr>${stockRows}</table>
  </section>
  <section class="panel"><h2>🥚 本月销售明细</h2>${salesTable(m,true)}</section>`;
}

  const rows=[...S.flock].sort((a,b)=>a.date<b.date?1:-1).map(r=>`<tr><td>${r.date}</td><td>${r.type}</td><td>${r.house}</td><td class="money ${r.qty<0?'neg':'pos'}">${r.qty>0?"+":""}${r.qty}</td><td>${r.note||""}</td><td class="row-actions"><button class="del" onclick="delRow('flock','${r.id}')">删</button></td></tr>`).join("");
  return `<table><tr><th>日期</th><th>类型</th><th>鸡舍</th><th>数量</th><th>备注</th><th></th></tr>${rows}<tr><td colspan="3"><b>当前存栏合计</b></td><td class="money"><b>${stockCount()}</b></td><td colspan="2"></td></tr></table>`}

  const recipeHtml=`

  <form onsubmit="saveRecipe(event)">

    <table style="margin:4px 0"><tr><th>品种</th><th>包数</th><th>千克/包</th><th>占比%</th></tr>
      ${rRows}

    <button type="button" class="mini" onclick="pctFill()">⚖️ 按包数折算占比</button> <button type="button" class="mini" onclick="recipeAddRow()">➕ 加一个品种</button>
    <datalist id="feed_items_dl">${FEED_ITEMS.map(i=>`<option value="${i}">`).join("")}</datalist>
    <button class="go">保存配方</button>
  </form>
  <div class="hint">可以只填包数不填占比: 各行填「包数」(千克/包留空则用该物料入库时记下的包重, 没记过按默认${bagKg()}kg), 保存时自动折成占比; 或点「⚖️ 按包数折算占比」先看结果再保存。品种不够就点「➕ 加一个品种」(最多12个)。清单里有玉米/豆粕/预混料/麦麸/石粉/磷酸氢钙/食盐/多维等, 清单外的名字直接打字也行。设好后每天消耗自动出库(打开App时补记, 最多补7天), 只记有鸡的日子: 当天存栏大于0才记, 上鸡日之前的不会再记。上栏量变了改「每日总耗料」就行, 不用天天登记。</div></section>

  return recipeHtml+`<section class="panel"><h2>➕ 物料出入库</h2>

// ================= 行情统计 =================
// 原料价: feedLog 里入库且填了单价 (元/斤); 鸡蛋价: sales (元/斤, 枚/件折算或单独看)
function periodKey(date,mode){const y=date.slice(0,4),m=+date.slice(5,7);
  if(mode==="月")return date.slice(0,7);
  if(mode==="季")return y+" Q"+Math.ceil(m/3);
  return y}
function priceStats(list,dateF,pF,mode,weightF){ // 加权平均: 权重=数量
  const t={};
  for(const r of list){const p=+pF(r);if(!p||p<=0)continue;const k=periodKey(dateF(r),mode);
    (t[k]=t[k]||{wsum:0,w:0,n:0});t[k].wsum+=p*(weightF?weightF(r):1);t[k].w+=(weightF?weightF(r):1);t[k].n++}
  return Object.keys(t).sort().map(k=>({k,avg:r2(t[k].wsum/t[k].w),n:t[k].n}))
}
function deltaLine(arr){ // 相邻两期涨跌
  if(!arr||arr.length<2)return "";
  const a=arr[arr.length-2].avg,b=arr[arr.length-1].avg;
  const pct=a?r2((b-a)/a*100):0;
  return `<span class="tag ${b>=a?'up':'dn'}">${b>=a?"▲":"▼"} ${Math.abs(pct)}%</span> 较上期${b>=a?"涨":"跌"} ${fmt(r2(Math.abs(b-a)))} 元`}
function priceChart(arr,unit,color){ // 纯CSS柱状图, 无外部库
  if(!arr.length)return `<div class="empty">暂无带单价的数据 — 去「饲料物料」入库时填单价, 或「鸡蛋销售」记每笔单价</div>`;
  const max=Math.max(...arr.map(x=>x.avg)),min=Math.min(...arr.map(x=>x.avg));
  const span=(max-min)||1;
  const bars=arr.map((x,i)=>{const h=18+Math.round((x.avg-min)/span*82); // 18%~100%高度
    const up=i>0&&x.avg>=arr[i-1].avg;
    return `<div class="barwrap"><div class="barval">${x.avg}</div><div class="bar" style="height:${h}%;background:${up?color:'#CC8B6B'}"></div><div class="barlab">${x.k.replace(new RegExp('^'+arr[0].k.slice(0,4)),'')}</div><div class="barn">${x.n}笔</div></div>`}).join("");
  return `<div class="chart">${bars}</div><div class="hint">柱高=价格水平; 橙色柱=比上期涨, 棕色柱=跌。单价区间 ${min}~${max} ${unit}。</div>`}

function recalcStockFromLog(){ // 从全部流水重算库存(合并同步后调用, 消除两机库存漂移)
  const st={};
  S.feedLog.forEach(r=>{const j=r2(+r.jin||0);if(!j)return;
    st[r.item]=r2((st[r.item]||0)+((r.dir||"").startsWith("出")?-j:j))});
  S.feedStock=st}
// ================= ☁️ GitHub 私库加密同步 =================
// 原理: 账本JSON -> 用App密码经PBKDF2派生密钥 -> AES-GCM加密 -> base64 -> 存GitHub私库data.json
// 云端只有密文; 同一台"密码"才能解开. token只存本机.
const SYNC_REPO="zhaoyu-12/eggxiaogu-sync";
async function deriveKey(pw,salt){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:150000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function encData(obj,pw){
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await deriveKey(pw,salt);
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(JSON.stringify(obj)));
  const all=new Uint8Array(16+12+ct.byteLength);all.set(salt,0);all.set(iv,16);all.set(new Uint8Array(ct),28);
  return btoa(String.fromCharCode(...all))}
async function decData(b64,pw){
  const raw=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  const salt=raw.slice(0,16),iv=raw.slice(16,28),ct=raw.slice(28);
  const key=await deriveKey(pw,salt);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct);
  return JSON.parse(new TextDecoder().decode(pt))}
async function ghGet(){ // 拉云端密文(404=云端还没有)
  const t=S.sync.token;const r=await fetch(`https://api.github.com/repos/${SYNC_REPO}/contents/data.json`,{cache:"no-store",headers:{Authorization:`token ${t}`}});
  if(r.status===404)return null;if(!r.ok)throw new Error("读取失败 "+r.status);
  const j=await r.json();return {b64:j.content.replace(/\s/g,""),sha:j.sha}}
async function ghPut(b64,sha){ // 推密文
  const t=S.sync.token;
  const body={message:"账本同步 "+new Date().toISOString().slice(0,16).replace("T"," "),content:b64};
  if(sha)body.sha=sha;
  const r=await fetch(`https://api.github.com/repos/${SYNC_REPO}/contents/data.json`,{method:"PUT",headers:{Authorization:`token ${t}`,"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok)throw new Error("上传失败 "+r.status);return (await r.json()).content.sha}
let LAST_SYNC_MSG="",LAST_SYNC_ERR=false;
function syncMsg(m,err){LAST_SYNC_MSG=m;LAST_SYNC_ERR=!!err;const el=document.getElementById("sync_msg");if(el)el.innerHTML=`<div class="hint" style="color:${err?'#B3261E':'#2E7D32'}">${m}</div>`;else if(!err)console.log(m)}

function touchSave(){save();if(syncOn())autoPush()} // 记账即存, 存完排队自动上传
let pushTimer=null;
function autoPush(){ // 防抖: 停止记账1.5秒后才真上传, 连续记十几笔只传一次
  if(pushTimer)clearTimeout(pushTimer);
  pushTimer=setTimeout(()=>{doPush(true).catch(e=>{LAST_SYNC_MSG="自动上传失败: "+e.message+" (数据已存在本机, 稍后手动传一次即可)";LAST_SYNC_ERR=true;const el=document.getElementById("sync_msg");if(el)el.innerHTML=`<div class="hint" style="color:#B3261E">${LAST_SYNC_MSG}</div>`})},1500)}
async function mergePull(pw){ // 拉云端, 与本机双向合并(按记录id去重, 互不覆盖, 新账号另算)
  const cur=await ghGet();if(!cur)return {merged:0};
  let remote;try{remote=await decData(cur.b64,pw)}catch(e){throw new Error("解不开——密码不对")}
  let added=0;
  // 数组类: 双向按 id 并集; 标量类(flock 计划/疫苗计划): remote 有本机没有的 key 才收
  const arrays=["flock","feedLog","finance","sales","vaccines"];
  arrays.forEach(k=>{
    const R=remote[k]||[],L=S[k]||[];
    const ids=new Set(L.map(r=>r.id).filter(Boolean));
    const inc=R.filter(r=>!r.id||!ids.has(r.id));
    if(inc.length){added+=inc.length;S[k]=L.concat(inc)}})
  Object.keys(remote.plan||{}).forEach(k=>{if(!(k in (S.plan||{})))S.plan[k]=remote.plan[k]});
  (remote.vaccines||[]).forEach(()=>{});
  return {merged:added}}
function syncAutoToggle(on){ // 开关自动同步; 开时把当前密码框的密码记进本机(自动同步要用)
  S.sync=S.sync||{};
  if(on){const el=document.getElementById("sync_pw");const pw=el&&el.value.trim();
    if(!pw){alert("请先在上方输入加密密码, 再打开自动同步");S.sync.auto=false;render();return}
    S.sync.pw=pw;S.sync.auto=true;save();autoPush();
    syncMsg("✅ 自动同步已开: 记账后自动上传, 打开App自动并入手账。密码已记在本机(仅本机)。")}
  else{S.sync.auto=false;save();syncMsg("自动同步已关。")}}
async function syncMergeNow(){ // 手动触发一次"拉取合并"(不覆盖, 两边并集)
  try{
    if(!S.sync||!S.sync.token){syncMsg("请先填入同步令牌",true);return}
    const el=document.getElementById("sync_pw");const pw=el&&el.value.trim()||S.sync.pw||"";
    if(!pw){syncMsg("请输入加密密码",true);return}
    S.sync.pw=pw;
    syncMsg("⏳ 正在拉取并合并…");
    const r=await mergePull(pw);
    if(!r||r.merged===0){syncMsg("云端没有新东西, 两边已是一致。");return}
    recalcStockFromLog();save();await doPush(false);

  catch(e){syncMsg("❌ "+e.message,true)}}
async function syncSetup(e){ // 首次配置: 存token
  e.preventDefault();const d=fd(e.target);const t=(d.token||"").trim();
  if(!/^(ghp_|gho_|ghu_|ghs_|github_pat_)/.test(t)){syncMsg("token 格式不像 GitHub 的(应以 ghp_ 或 gho_ 开头), 请回 GitHub 粘贴完整的令牌",true);return}
  S.sync=S.sync||{};S.sync.token=t;save();syncMsg("✅ 已保存令牌(只存本机)。下面可以上传/下载了。");render()}
async function doPush(isAuto){ // 上传(自动/手动共用): 先拉云端合并, 再整包加密推回
  if(!S.sync||!S.sync.token)throw new Error("请先填入同步令牌");
  const pwEl=document.getElementById("sync_pw");
  const pw=isAuto?(S.sync.pw||""):(pwEl&&pwEl.value||S.sync.pw||"");
  if(!pw)throw new Error("请输入加密密码");
  const b64=await encData(S,pw);
  const cur=await ghGet();
  if(cur){try{await decData(cur.b64,pw)}catch(e){
    if(isAuto){S.sync.auto=false;save();throw new Error("云端密码与本机不一致, 已暂停自动同步")}
    throw new Error("密码与云端那份不一致——为防覆盖错账, 已停止")}}
  const sha=await ghPut(b64,cur?cur.sha:null);
  S.sync.lastUp=new Date().toISOString();S.sync.sha=sha;save();
  if(!isAuto)syncMsg(`✅ 上传成功(${new Date().toLocaleString("zh-CN",{hour12:false})})。另一台设备上点「下载同步」即可拉取。`);
  return true}
async function autoPull(){ // 打开App时自动收: 拉云端→按id合并→若并了新记录则重算库存→再回推
  const pw=S.sync.pw||"";if(!pw)return;
  const r=await mergePull(pw);
  if(healBad()>0)save(); // 云端合并可能带回旧误账, 合并后立即再清一次
  if(r&&r.merged>0){recalcStockFromLog();save();
    LAST_SYNC_MSG=`☁️ 自动同步: 从云端并入 ${r.merged} 笔记录(已重算库存)`;LAST_SYNC_ERR=false;
    const el=document.getElementById("sync_msg");if(el)el.innerHTML=`<div class="hint" style="color:#2E7D32">${LAST_SYNC_MSG}</div>`;
    await doPush(true);render()}}
async function syncUp(){ // 手动上传(旧入口保留)
  try{await doPush(false)}
  catch(e){syncMsg("❌ "+e.message,true)}}
async function syncDown(){ // 手动下载=整包覆盖(旧入口保留, 大搬家时用)
  try{
    if(!S.sync||!S.sync.token){syncMsg("请先填入同步令牌",true);return}
    const pw=document.getElementById("sync_pw").value;
    if(!pw){syncMsg("请输入解密密码(上传时用的那个)",true);return}
    syncMsg("⏳ 正在下载并解密…");
    const cur=await ghGet();
    if(!cur){syncMsg("云端还没有账本。请先在有数据的设备上「上传到云端」。",true);return}
    let remote;
    try{remote=await decData(cur.b64,pw)}catch(e){syncMsg("❌ 解不开——密码不对, 或这份密文是别的密码锁的。",true);return}
    const nR=(remote.feedLog||[]).length+(remote.sales||[]).length+(remote.finance||[]).length;
    const nL=S.feedLog.length+S.sales.length+S.finance.length;
    if(!confirm(`云端账本: 流水约 ${nR} 笔(存栏${(remote.flock||[]).reduce((a,r)=>a+r.qty,0)}只)\n本机账本: 流水约 ${nL} 笔\n\n用云端覆盖本机? 本机现有数据会先自动导出一份备份。`))return;
    exportData(true); // 静默导出保底
    const keep={sync:S.sync,auth:S.auth};
    S=Object.assign(JSON.parse(JSON.stringify(EMPTY)),remote);
    S.sync=keep.sync;S.auth=keep.auth||S.auth;
    if(!S.consume)S.consume={};if(!S.recipe)S.recipe=null;
    S.sync.sha=cur.sha;S.sync.lastDown=new Date().toISOString();save();
    syncMsg(`✅ 下载并恢复成功(${new Date().toLocaleString("zh-CN",{hour12:false})})。`);render()}
  catch(e){syncMsg("❌ "+e.message,true)}}

function fd(f){const o={};new FormData(f).forEach((v,k)=>{if(k.endsWith("_c"))return;o[k]=typeof v==="string"?v.trim():v});f.querySelectorAll("select").forEach(s=>{if(s.value==="__custom__"){const c=f.querySelector(`[name="${s.name}_c"]`);o[s.name]=c&&c.value.trim()?c.value.trim():""}delete o[s.name+"_c"]});return o}

function addFeed(e){e.preventDefault();const d=fd(e.target);const u=FEED_UNITS.find(x=>x[0]===d.unit);const jin=(d.unit==="包")?r2(+d.qty*bagKg()*2):r2(+d.qty*(u?u[1]:1));const out=d.dir.startsWith("出");S.feedStock[d.item]=(S.feedStock[d.item]||0)+(out?-jin:jin);if(S.feedStock[d.item]<0&&!confirm(`${d.item}库存将变为${S.feedStock[d.item]}斤(负数, 可能漏记了入库), 仍要继续吗?`)){S.feedStock[d.item]+=out?jin:-jin;return}S.feedLog.push({id:uid(),date:d.date,item:d.item,dir:d.dir,qty:+d.qty,unit:d.unit||"斤",jin,price:d.price,note:(d.unit==="包"?`每包${kgo}kg, `:"")+(d.note||"")});touchSave();render()}

function addVax(e){e.preventDefault();const d=fd(e.target);S.vaccines.push({id:uid(),...d});touchSave();render()}
function delRow(arr,id){if(!confirm("删除这条记录?"))return;S[arr]=S[arr].filter(r=>r.id!==id);touchSave();render()}
function exportData(silent){const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`蛋小固管家备份_${today()}.json`;if(silent)return;a.click()}
function importData(e){const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!confirm("导入将覆盖当前数据, 继续?"))return;S=Object.assign(JSON.parse(JSON.stringify(EMPTY)),d);save();location.reload()}catch(err){alert("文件不是有效备份: "+err.message)}};rd.readAsText(f)}
function afterRender(){}

// ================= 启动 =================
if(loggedIn()){renderNav();bootApp()}else{renderNav();loginScreen()}
document.title="蛋小固 · 蛋鸡场管家";
// PWA: 注册离线缓存 (file:// 打开时自动跳过, 不影响本地使用)
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){
  navigator.serviceWorker.register("sw.js").catch(()=>{})}
